<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Invitation Mariage • Éclat & Amour</title>

<style>

/* =========================
   BASE
========================= */

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:#eee;
font-family:Georgia,"Times New Roman",serif;
}

/* =========================
   COULEURS OR LUXE
========================= */

:root{
--gold-dark:#8f6b22;
--gold:#c9a64a;
--gold-light:#f8e7a1;
--gold-bright:#fff1b8;
}

/* =========================
   PAGE CREATION
========================= */

.creator{
max-width:600px;
margin:auto;
padding:25px;
}

.creator h1{
text-align:center;
font-weight:normal;

background:linear-gradient(
90deg,
var(--gold-dark),
var(--gold-light),
var(--gold),
var(--gold-bright),
var(--gold-dark)
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;

font-size:32px;
margin-bottom:25px;
}

/* =========================
   FORMULAIRE
========================= */

.form{
background:
linear-gradient(
145deg,
#17130b,
#0c0c0c
);

padding:25px;

border:1px solid #705823;

border-radius:14px;

box-shadow:
0 0 25px rgba(201,166,74,.08),
inset 0 0 30px rgba(201,166,74,.03);
}

label{
display:block;

font-family:Arial,sans-serif;

font-size:13px;

margin-top:15px;

color:var(--gold-light);

letter-spacing:.4px;
}

input,
textarea{
width:100%;

padding:13px;

margin-top:6px;

background:#111;

border:1px solid #51431f;

border-radius:7px;

color:white;

font-family:Arial,sans-serif;

outline:none;
}

input:focus,
textarea:focus{
border-color:var(--gold);

box-shadow:0 0 8px rgba(201,166,74,.18);
}

textarea{
height:110px;
resize:vertical;
}

/* =========================
   BOUTON
========================= */

button{
width:100%;

padding:15px;

margin-top:22px;

border:0;

border-radius:7px;

background:
linear-gradient(
135deg,
#8f6b22,
#f8e7a1,
#c9a64a,
#fff1b8,
#9f7828
);

color:#111;

font-weight:bold;

font-size:15px;

cursor:pointer;

box-shadow:
0 5px 18px rgba(201,166,74,.15);

transition:.25s;
}

button:hover{
transform:translateY(-1px);

box-shadow:
0 7px 22px rgba(201,166,74,.25);
}

/* =========================
   RESULTAT
========================= */

.result{
margin-top:20px;

padding:15px;

background:#17130b;

border:1px solid #705823;

border-radius:7px;

font-family:Arial,sans-serif;

font-size:13px;

word-break:break-all;

color:#eee;
}

/* =========================
   INVITATION
========================= */

.invitation{

max-width:700px;

margin:30px auto;

min-height:700px;

padding:70px 25px;

text-align:center;

background:

radial-gradient(
circle at 50% 0%,
#3a2b13 0%,
#17130c 22%,
#0b0b0b 48%,
#050505 75%
);

border:1px solid #b9974a;

box-shadow:

0 0 25px rgba(201,166,74,.18),

0 0 80px rgba(201,166,74,.04),

inset 0 0 50px rgba(201,166,74,.05);

position:relative;

overflow:hidden;
}

/* =========================
   ECLATS DECORATIFS
========================= */

.invitation::before{

content:"✦   ✧   ✦   ✧   ✦";

position:absolute;

top:18px;

left:0;

right:0;

font-size:18px;

letter-spacing:14px;

background:

linear-gradient(
90deg,
#8f6b22,
#fff1b8,
#c9a64a,
#fff1b8,
#8f6b22
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

background-clip:text;

opacity:.8;
}

.invitation::after{

content:"✦";

position:absolute;

right:30px;

bottom:25px;

font-size:45px;

color:#f5df91;

text-shadow:

0 0 6px #f5df91,

0 0 18px rgba(245,223,145,.7),

0 0 35px rgba(201,166,74,.4);

animation:sparkle 2.5s infinite;
}

@keyframes sparkle{

0%,100%{
opacity:.35;
transform:scale(.8) rotate(0deg);
}

50%{
opacity:1;
transform:scale(1.15) rotate(15deg);
}

}

/* =========================
   OR LUXE
========================= */

.gold{

background:

linear-gradient(
90deg,
#8f6b22,
#f8e7a1,
#c9a64a,
#fff1b8,
#a67c25
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

background-clip:text;
}

/* =========================
   PETIT TEXTE
========================= */

.small{

font-family:Arial,sans-serif;

font-size:11px;

letter-spacing:5px;

background:

linear-gradient(
90deg,
#8f6b22,
#fff1b8,
#c9a64a,
#fff1b8,
#8f6b22
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

background-clip:text;

margin-top:10px;
}

/* =========================
   NOMS
========================= */

.names{

font-size:55px;

font-weight:normal;

margin:35px 0;

line-height:1.2;

text-shadow:

0 0 12px rgba(201,166,74,.08);
}

.names .gold{

margin:0 8px;
}

/* =========================
   MESSAGE
========================= */

.message{

max-width:520px;

margin:30px auto;

line-height:1.9;

color:#d8d2c7;

font-size:16px;
}

/* =========================
   DATE
========================= */

.date{

font-family:Arial,sans-serif;

letter-spacing:2px;

background:

linear-gradient(
90deg,
#9f7828,
#fff1b8,
#c9a64a,
#fff1b8,
#9f7828
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

background-clip:text;

margin:35px 0;

font-weight:bold;
}

/* =========================
   COMPTE A REBOURS
========================= */

.count{

font-family:Arial,sans-serif;

padding:18px;

border-top:1px solid #705823;

border-bottom:1px solid #705823;

margin:25px auto;

max-width:500px;

color:#eee;

letter-spacing:.5px;

background:rgba(201,166,74,.025);
}

/* =========================
   LOCALISATION
========================= */

.map{

display:inline-block;

margin-top:15px;

color:#e5ca78;

font-family:Arial
