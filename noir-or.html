<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Éclat & Amour</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
background:#030303;
color:#eee;
font-family:Georgia,"Times New Roman",serif;
overflow-x:hidden;
}

:root{
--gold-dark:#80601d;
--gold:#c9a64a;
--gold-light:#f4dda0;
--gold-bright:#fff2bd;
}

/* =====================================================
   FORMULAIRE
===================================================== */

.creator{
max-width:600px;
margin:auto;
padding:28px 20px;
}

.creator h1{
text-align:center;
font-weight:normal;
font-size:34px;

background:
linear-gradient(
90deg,
#80601d,
#f4dda0,
#c9a64a,
#fff2bd,
#80601d
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;

text-shadow:
0 0 25px rgba(201,166,74,.12);

margin-bottom:28px;
}

.form{

background:
linear-gradient(
145deg,
#17130b,
#090909
);

padding:26px;

border:1px solid #715a27;

border-radius:15px;

box-shadow:
0 0 35px rgba(201,166,74,.08),
inset 0 0 35px rgba(201,166,74,.025);
}

label{

display:block;

margin-top:16px;

font-family:Arial,sans-serif;

font-size:13px;

letter-spacing:.3px;

color:var(--gold-light);
}

input,
textarea{

width:100%;

padding:13px;

margin-top:7px;

background:#111;

border:1px solid #4d401e;

border-radius:7px;

color:white;

font-family:Arial,sans-serif;

outline:none;

transition:.25s;
}

input:focus,
textarea:focus{

border-color:var(--gold);

box-shadow:
0 0 10px rgba(201,166,74,.15);
}

textarea{

height:105px;

resize:vertical;
}

button{

width:100%;

padding:15px;

margin-top:23px;

border:0;

border-radius:8px;

background:

linear-gradient(
135deg,
#80601d,
#f4dda0,
#c9a64a,
#fff2bd,
#927026
);

color:#111;

font-size:15px;

font-weight:bold;

cursor:pointer;

box-shadow:
0 7px 25px rgba(201,166,74,.13);

transition:.3s;
}

button:hover{

transform:translateY(-2px);

box-shadow:
0 10px 30px rgba(201,166,74,.22);
}

.result{

margin-top:20px;

padding:16px;

background:#161108;

border:1px solid #715a27;

border-radius:8px;

font-family:Arial,sans-serif;

font-size:13px;

word-break:break-all;

}

/* =====================================================
   INVITATION
===================================================== */

.invitation{

max-width:720px;

min-height:720px;

margin:30px auto;

padding:75px 25px;

position:relative;

overflow:hidden;

text-align:center;

background:

radial-gradient(
ellipse at 50% -10%,
#4a3715 0%,
#211a0d 18%,
#0d0c09 43%,
#030303 75%
);

border:1px solid #b9974a;

box-shadow:

0 0 35px rgba(201,166,74,.18),

0 0 100px rgba(201,166,74,.05),

inset 0 0 70px rgba(201,166,74,.04);
}

/* =====================================================
   LUMIERE DERRIERE LES NOMS
===================================================== */

.invitation:before{

content:"";

position:absolute;

width:500px;

height:250px;

left:50%;

top:-100px;

transform:translateX(-50%);

background:

radial-gradient(
ellipse,
rgba(244,221,160,.14),
transparent 70%
);

pointer-events:none;
}

/* =====================================================
   POUSSIERE D'OR
===================================================== */

.gold-wind{

position:absolute;

inset:0;

pointer-events:none;

overflow:hidden;

z-index:1;
}

.gold-wind span{

position:absolute;

width:3px;

height:3px;

border-radius:50%;

background:#f8e7a1;

box-shadow:

0 0 5px #f8e7a1,

0 0 12px rgba(248,231,161,.9),

0 0 22px rgba(201,166,74,.4);

opacity:0;

animation:
goldWind 8s linear infinite;
}

/* positions */

.gold-wind span:nth-child(1){
top:15%;
left:-5%;
animation-delay:0s;
}

.gold-wind span:nth-child(2){
top:25%;
left:5%;
animation-delay:1s;
}

.gold-wind span:nth-child(3){
top:38%;
left:-8%;
animation-delay:2s;
}

.gold-wind span:nth-child(4){
top:52%;
left:10%;
animation-delay:3s;
}

.gold-wind span:nth-child(5){
top:68%;
left:-6%;
animation-delay:4s;
}

.gold-wind span:nth-child(6){
top:78%;
left:18%;
animation-delay:5s;
}

.gold-wind span:nth-child(7){
top:32%;
left:28%;
animation-delay:2.5s;
}

.gold-wind span:nth-child(8){
top:60%;
left:38%;
animation-delay:4.5s;
}

.gold-wind span:nth-child(9){
top:18%;
left:50%;
animation-delay:1.5s;
}

.gold-wind span:nth-child(10){
top:43%;
left:58%;
animation-delay:3.5s;
}

.gold-wind span:nth-child(11){
top:70%;
left:55%;
animation-delay:5.5s;
}

.gold-wind span:nth-child(12){
top:35%;
left:72%;
animation-delay:2.2s;
}

.gold-wind span:nth-child(13){
top:17%;
left:84%;
animation-delay:4.2s;
}

.gold-wind span:nth-child(14){
top:55%;
left:90%;
animation-delay:1.8s;
}

.gold-wind span:nth-child(15){
top:76%;
left:70%;
animation-delay:6s;
}

.gold-wind span:nth-child(16){
top:28%;
left:96%;
animation-delay:3s;
}

/* =====================================================
   ANIMATION VENT
===================================================== */

@keyframes goldWind{

0%{

transform:
translate(-40px,70px)
rotate(0deg)
scale(.3);

opacity:0;
}

12%{

opacity:.9;
}

35%{

transform:
translate(80px,20px)
rotate(120deg)
scale(1.2);

opacity:.85;
}

60%{

transform:
translate(190px,-35px)
rotate(230deg)
scale(1.5);

opacity:.65;
}

82%{

opacity:.3;
}

100%{

transform:
translate(430px,-150px)
rotate(400deg)
scale(.2);

opacity:0;
}

}

/* =====================================================
   GROS ECLATS
===================================================== */

.spark{

position:absolute;

font-size:45px;

color:#f8e7a1;

text-shadow:

0 0 6px #fff2bd,

0 0 18px #f4dda0,

0 0 35px #c9a64a,

0 0 60px rgba(201,166,74,.5);

z-index:3;

animation:
sparkle 3s ease-in-out infinite;
}

.spark.one{

right:30px;

bottom:35px;
}

.spark.two{

left:30px;

top:110px;

font-size:28px;

animation-delay:1.2s;
}

.spark.three{

right:90px;

top:180px;

font-size:20px;

animation-delay:2s;
}

@keyframes sparkle{

0%,100%{

opacity:.25;

transform:
scale(.7)
rotate(0deg);
}

50%{

opacity:1;

transform:
scale(1.25)
rotate(25deg);
}

}

/* =====================================================
   TEXTE
===================================================== */

.small{

font-family:Arial,sans-serif;

font-size:11px;

letter-spacing:6px;

color:var(--gold-light);

position:relative;

z-index:4;
}

.names{

font-size:56px;

font-weight:normal;

line-height:1.2;

margin:40px 0;

position:relative;

z-index:4;

text-shadow:

0 0 20px rgba(201,166,74,.12);
}

.gold{

background:

linear-gradient(
90deg,
#80601d,
#f4dda0,
#c9a64a,
#fff2bd,
#a67c25
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

background-clip:text;
}

.message{

max-width:520px;

margin:30px auto;

line-height:1.9;

color:#d8d2c7;

font-size:16px;

position:relative;

z-index:4;
}

.date{

font-family:Arial,sans-serif;

letter-spacing:2px;

margin:35px 0;

font-weight:bold;

color:#e5ca78;

position:relative;

z-index:4;
}

.count{

font-family:Arial,sans-serif;

padding:18px;

margin:25px auto;

max-width:500px;

border-top:1px solid #715a27;

border-bottom:1px solid #715a27;

color:#eee;

position:relative;

z-index:4;

background:
rgba(201,166,74,.025);
}

.map{

display:inline-block;

margin-top:15px;

color:#e5ca78;

font-family:Arial,sans-serif;

font-weight:bold;

text-decoration:none;

border-bottom:1px solid #8f6b22;

padding-bottom:4px;

position:relative;

z-index:4;
}

.final-message{

margin-top:45px;

position:relative;

z-index:4;

}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

.creator{

padding:20px 15px;
}

.creator h1{

font-size:29px;
}

.invitation{

margin:20px 10px;

min-height:680px;

padding:70px 18px;
}

.names{

font-size:39px;
}

.message{

font-size:15px;
}

}

/* =====================================================
   REDUCTION DES ANIMATIONS SI NECESSAIRE
===================================================== */

@media(prefers-reduced-motion:reduce){

.gold-wind span,
.spark{

animation:none;
}

}

</style>

</head>

<body>


<!-- =====================================================
     CREATEUR
===================================================== -->

<div class="creator">

<h1>Éclat & Amour</h1>

<div class="form">

<label>
Prénom du marié
</label>

<input
id="groom"
placeholder="Exemple : Amine"
>

<label>
Prénom de la mariée
</label>

<input
id="bride"
placeholder="Exemple : Sarah"
>

<label>
Date et heure
</label>

<input
id="date"
type="datetime-local"
>

<label>
Nom de la salle
</label>

<input
id="venue"
placeholder="Salle des Fêtes"
>

<label>
Lien Google Maps
</label>

<input
id="maps"
placeholder="Lien Google Maps"
>

<label>
Message
</label>

<textarea id="message">Nous avons le plaisir de vous inviter à partager avec nous ce jour si particulier.</textarea>

<button onclick="generate()">

✨ Générer mon invitation

</button>

<div id="result"></div>

</div>

</div>


<!-- =====================================================
     INVITATION
===================================================== -->

<div class="invitation">


<!-- poussière d'or -->

<div class="gold-wind">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>


<!-- éclats -->

<div class="spark one">
✦
</div>

<div class="spark two">
✧
</div>

<div class="spark three">
✦
</div>


<div class="small">

NOTRE MARIAGE

</div>


<div class="names">

<span
id="groomDisplay"
class="gold"
>

Amine

</span>

<span class="gold">

&

</span>

<span
id="brideDisplay"
class="gold"
>

Sarah

</span>

</div>


<p
class="message"
id="messageDisplay"
>

Nous avons le plaisir de vous inviter à partager avec nous ce jour si particulier.

</p>


<div
class="date"
id="dateDisplay"
>

NOTRE GRAND JOUR

</div>


<div
class="count"
id="countdown"
>

Compte à rebours

</div>


<p>

📍

<span id="venueDisplay">

Salle des Fêtes

</span>

</p>


<a
id="mapsDisplay"
class="map"
target="_blank"
style="display:none"
>

Voir la localisation

</a>


<p class="gold final-message">

Votre présence sera notre plus beau cadeau

</p>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

let weddingDate;


/* =====================================================
   GENERATION
===================================================== */

function generate(){

const groom =
document
.getElementById("groom")
.value
.trim();

const bride =
document
.getElementById("bride")
.value
.trim();

const date =
document
.getElementById("date")
.value;

const venue =
document
.getElementById("venue")
.value
.trim();

const maps =
document
.getElementById("maps")
.value
.trim();

const message =
document
.getElementById("message")
.value
.trim();


if(!groom || !bride || !date){

alert(
"Veuillez remplir les prénoms et la date."
);

return;

}


/* affichage */

document
.getElementById("groomDisplay")
.innerText =
groom;

document
.getElementById("brideDisplay")
.innerText =
bride;

document
.getElementById("venueDisplay")
.innerText =
venue;

document
.getElementById("messageDisplay")
.innerText =
message;


/* date */

weddingDate =
new Date(date);

document
.getElementById("dateDisplay")
.innerText =

weddingDate.toLocaleString(
"fr-FR",
{
day:"2-digit",
month:"long",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}
);


/* maps */

if(maps){

const a =
document
.getElementById("mapsDisplay");

a.href =
maps;

a.style.display =
"inline-block";

}


/* lien */

const params =
new URLSearchParams();

params.set(
"groom",
groom
);

params.set(
"bride",
bride
);

params.set(
"date",
date
);

params.set(
"venue",
venue
);

params.set(
"maps",
maps
);

params.set(
"message",
message
);


const link =

location.origin +
location.pathname +
"?" +
params.toString();


document
.getElementById("result")
.innerHTML =

"✨ Votre invitation est prête !<br><br>" +

"<b>" +
link +
"</b>" +

"<br><br>" +

"Copiez ce lien et envoyez-le à vos invités.";

}


/* =====================================================
   CHARGEMENT
===================================================== */

function load(){

const params =

new URLSearchParams(
location.search
);


if(!params.has("groom"))
return;


/* cacher création */

document
.querySelector(".creator")
.style.display =
"none";


const groom =
params.get("groom");

const bride =
params.get("bride");

const date =
params.get("date");

const venue =
params.get("venue");

const maps =
params.get("maps");

const message =
params.get("message");


document
.getElementById("groomDisplay")
.innerText =
groom;

document
.getElementById("brideDisplay")
.innerText =
bride;

document
.getElementById("venueDisplay")
.innerText =
venue;

document
.getElementById("messageDisplay")
.innerText =
message;


/* date */

if(date){

weddingDate =
new Date(date);

document
.getElementById("dateDisplay")
.innerText =

weddingDate.toLocaleString(
"fr-FR",
{
day:"2-digit",
month:"long",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}
);

}


/* maps */

if(maps){

const a =
document
.getElementById("mapsDisplay");

a.href =
maps;

a.style.display =
"inline-block";

}

}


/* =====================================================
   COMPTE A REBOURS
===================================================== */

function countdown(){

if(!weddingDate)
return;


const difference =

weddingDate -
new Date();


if(difference <= 0){

document
.getElementById("countdown")
.innerText =

"C'est le grand jour ! ❤️";

return;

}


const days =

Math.floor(
difference /
86400000
);

const hours =

Math.floor(
difference /
3600000
) % 24;

const minutes =

Math.floor(
difference /
60000
) % 60;

const seconds =

Math.floor(
difference /
1000
) % 60;


document
.getElementById("countdown")
.innerText =

days +
" jours • " +

hours +
" h • " +

minutes +
" min • " +

seconds +
" sec";

}


/* =====================================================
   LANCEMENT
===================================================== */

load();

setInterval(
countdown,
1000
);

</script>

</body>

  </html>
